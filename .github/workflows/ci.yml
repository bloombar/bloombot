# Continuous integration and deployment for Bloombot (OPS-6, OPS-7).
#
# Three test jobs — the Python suite covering the bot and the management
# scripts, the Node suite covering the project-board tooling and the
# docs/SPEC.md format contract, and a shellcheck pass over the deploy script —
# followed by a deploy job that ships the commit to the droplet.
#
# The test jobs use no secrets. The Python suite runs with dummy credentials
# supplied by tests/conftest.py and a throwaway SQLite database, so it never
# touches real Discord, OpenAI or student data.
#
# The deploy job runs only for pushes to master (i.e. a merged pull request) and
# for manual runs on master, and only after every test job has passed. Pull
# request events can never satisfy its `if`, and its secrets live in the
# `production` environment, so a pull request from a fork of this public repo
# cannot reach the deploy key.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: >-
          Full 40-character commit SHA to deploy. Leave blank to deploy the
          commit this run is based on. Set it to an earlier commit to roll back.
        required: false
        type: string

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pipenv
        run: pipx install pipenv

      - name: Install dependencies
        # --dev brings in pytest; --deploy fails fast if Pipfile.lock is stale.
        run: pipenv install --dev --deploy

      - name: Run tests
        run: pipenv run pytest tests/ -v

  node:
    name: Board tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check the coverage floor over the data access layer (QA-4)
        run: npm run test:coverage

      - name: Check the board manifest is up to date with the SPEC
        # derive is deterministic: if re-running it changes manifest.yaml, the
        # SPEC or ROADMAP was edited without regenerating the manifest.
        run: |
          npm run board:derive
          git diff --exit-code scripts/board/manifest.yaml

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships with the GitHub runner image — no action to install.
      - name: Lint scripts/deploy.sh
        run: shellcheck scripts/deploy.sh

      # The agent guardrail hooks are the only thing standing between an agent
      # and the live student database or a committed secret, so they are linted
      # like the deploy script rather than treated as local tooling.
      - name: Lint .claude/hooks
        run: shellcheck .claude/hooks/*.sh

  deploy:
    name: Deploy to droplet
    needs: [python, node, shellcheck]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scopes DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS to this job. Adding required
    # reviewers to this environment turns every deploy into an approval click.
    environment: production
    # Never let two deploys touch the droplet at once, and never cancel one
    # half-way through — an interrupted deploy leaves pm2 in an unknown state.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Resolved before the checkout so the repository is checked out AT the
      # commit being deployed — a rollback then also rolls back the deploy
      # script that is piped to the droplet.
      - name: Resolve the commit to deploy
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.deploy_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          sha="${REQUESTED_SHA:-$DEFAULT_SHA}"
          # The SHA is interpolated into a remote shell command, so accept
          # nothing but a bare 40-character hex commit id.
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::not a full 40-character commit SHA: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # A variable, not a secret: host keys are public, and leaving this
          # unmasked keeps a fingerprint mismatch debuggable from the log.
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::secret DEPLOY_SSH_KEY must be set in the production environment"
            exit 1
          fi
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::variable DEPLOY_KNOWN_HOSTS must be set (ssh-keygen -F <host> -f ~/.ssh/known_hosts)"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The host key is pinned, so a redirected or spoofed host fails the
          # deploy instead of being trusted on first sight.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::error::repository variables DEPLOY_HOST and DEPLOY_USER must be set"
            exit 1
          fi

          # scripts/deploy.sh is piped in over stdin rather than run from the
          # droplet's checkout, so the deploy logic is always the version from
          # the commit being deployed and never rewrites itself mid-run.
          remote="bash -s -- $TARGET_SHA"
          if [ -n "$DEPLOY_PATH" ]; then
            remote="APP_DIR='$DEPLOY_PATH' $remote"
          fi

          echo "Deploying $TARGET_SHA to $DEPLOY_USER@$DEPLOY_HOST"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote" < scripts/deploy.sh

      - name: Summary
        if: always()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Deploy \`$RESULT\`"
            echo
            echo "Commit: \`$TARGET_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
