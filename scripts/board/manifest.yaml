- id: OPS-4
  title: Documented setup and operation
  full: "README.md documents the full path from a clean checkout to a running bot:
    prerequisites, dependency install, .env creation, database migration, course
    configuration, each script's purpose and invocation, notebook usage, and the
    pm2 lifecycle commands. It is the single onboarding document for a new
    instructor or maintainer."
  section: §10 Operations & Deployment
  family: OPS
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: OPS-5
  title: Secrets and generated data stay out of version control
  full: .env, the SQLite database, logs and real student data are excluded from
    version control; only env.example, empty-directory readmes and the
    anonymized xx-prefixed sample CSVs are committed. Student names, emails and
    Discord handles are personal data and must never be committed.
  section: §10 Operations & Deployment
  family: OPS
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ROST-1
  title: Roster and questionnaire inputs
  full: Two CSV inputs describe a course's students. A roster exported from the
    university's registration system lands in rosters/PREFIX-roster.csv and
    carries the authoritative names and email addresses. An intake questionnaire
    exported from a survey tool lands in questionnaires/PREFIX-intake.csv and
    carries the students' self-reported Discord and GitHub usernames along with
    background questions. The PREFIX matches the course's file_prefix in the
    config.
  section: §4 Roster Ingestion & Student Channels
  family: ROST
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ROST-2
  title: Roster merge
  full: "roster_setup.ipynb joins the roster with the questionnaire on email
    address and writes a merged file to results/PREFIX-result.csv with five
    normalized columns: Last, First, Email, GitHub and Discord. The notebook
    normalizes the questionnaire's verbose column headings to those short names,
    drops rows without an email address, and skips the leading non-data rows the
    registration export includes. Sample inputs and outputs under the xx prefix
    are committed as a worked example."
  section: §4 Roster Ingestion & Student Channels
  family: ROST
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ROST-3
  title: Per-student private channels
  full: roster_create_channels.py reads a merged results CSV and creates one
    private channel per student inside a configured students category. A channel
    is named after the local part of the student's email address, giving a
    stable, recognizable name that does not depend on the student's Discord
    handle. The script is run once per students category, after hydration has
    created the categories.
  section: §4 Roster Ingestion & Student Channels
  family: ROST
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ROST-4
  title: Row-range batching around Discord's category limit
  full: Discord permits at most 50 channels in a category, so a course with more
    students needs several numbered students categories. The script exposes
    ROSTER_START_ROW and ROSTER_END_ROW bounds alongside the target category
    name; the instructor runs it once per 50-student block, pointing each run at
    the next category.
  section: §4 Roster Ingestion & Student Channels
  family: ROST
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ROST-5
  title: Student channel permissions
  full: Each student channel denies @everyone, grants the individual student
    read_messages and send_messages, and grants the course's admins role the
    same, producing a private space between one student and the course staff.
    The student's Discord member is resolved from the roster's Discord column,
    matching display names as well as usernames. If the member cannot be found,
    the channel is still created with admin access and the missing student
    permission is reported rather than aborting the run.
  section: §4 Roster Ingestion & Student Channels
  family: ROST
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ROST-6
  title: Pinned welcome message and bad-handle reporting
  full: On first creation, each student channel receives a pinned welcome message
    stating that the channel is for conversation between the student and the
    course admins, followed by the student's first name, last name, email,
    Discord handle and GitHub handle. When the Discord handle from the intake
    questionnaire could not be resolved to a server member, the message instead
    says so explicitly, so staff can correct the handle by hand. Re-runs update
    permissions on existing channels without re-posting the welcome message.
  section: §4 Roster Ingestion & Student Channels
  family: ROST
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: SRV-1
  title: Whole-server hydration from config
  full: hydrate_server.py builds the entire category and channel structure for
    every course in bot_config.yml in a single run. For each course it walks the
    declared categories, and for each category it creates the category, applies
    the course's role permissions, and then creates that category's channels. It
    is the first script an instructor runs against a fresh server, before any
    students are added.
  section: §3 Server Scaffolding
  family: SRV
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: SRV-2
  title: Category permissions from course roles
  full: "Every category created by hydration is made private by default: @everyone
    is denied read_messages, and the course's admins and students roles are each
    granted read_messages and send_messages. Because Discord channels inherit
    their category's overwrites, this single permission write governs everything
    created beneath it. A role named in the config but absent from the server is
    skipped rather than treated as fatal."
  section: §3 Server Scaffolding
  family: SRV
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: SRV-3
  title: Named channels with admin-only overrides
  full: "When a category declares a channels list, each named channel is created
    inside it after the category permissions are in place, so the channel
    inherits them. A channel marked admins_only: true instead receives its own
    overwrite denying @everyone and granting only the course's admins role,
    which is how private instructor channels such as admins are produced
    alongside student-visible channels such as general, grading, tutoring,
    quizzes and exams."
  section: §3 Server Scaffolding
  family: SRV
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: SRV-4
  title: Placeholder channel for bare categories
  full: A category declared as a plain string, with no channels of its own,
    receives a single placeholder channel named temp. Discord hides a category
    that contains no channels, so the placeholder is what makes the category
    visible and available to receive per-student channels later. The
    placeholder's permissions are explicitly synced with its category, and a
    one-time notice is posted in it when it is first created.
  section: §3 Server Scaffolding
  family: SRV
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: SRV-5
  title: Idempotent re-runs
  full: Hydration is safe to re-run after the config changes. Categories and
    channels that already exist are not recreated; their permissions are
    recomputed and reapplied so that config edits — a new admin-only channel, a
    renamed role, a new semester's roles — take effect on the existing server.
    When permissions are updated on a pre-existing channel a short notice is
    posted to that channel so members can see why access changed.
  section: §3 Server Scaffolding
  family: SRV
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-11
  title: Daily request limit resets at the day boundary
  full: A user who exceeds their course's daily request limit must be able to ask
    again the following day. The limit is specified as requests per day (CFG-2,
    BOT-5), but the counter is only reset as part of recording a successful
    response, and the over-limit check returns before ever reaching that point.
    A user who goes over is therefore locked out permanently rather than until
    midnight, and only a process restart — which clears the in-memory counters —
    releases them. The day boundary must be evaluated when the limit is checked,
    not only when it is incremented.
  section: §5 AI Chatbot
  family: BOT
  phase: 1
  status: Done
  review: false
- id: BOT-12
  title: Role fallback matches the configured student role
  full: The role-based course routing fallback (BOT-3) must match the author's
    Discord roles against both role names a course declares under roles — admins
    and students. It currently reads a student key, which no course
    configuration defines, so the student half of the fallback can never match
    and only course admins are routed by role. Students messaging the bot
    outside a recognized course category go unanswered.
  section: §5 AI Chatbot
  family: BOT
  phase: 1
  status: Done
  review: false
- id: DATA-6
  title: Migration seed data matches the models
  full: migrate.py --populate must seed rows that the current User and Message
    models accept. Its mock data is left over from an earlier SMS project and
    sets phone, from_phone, to_phone and body — none of which exist on either
    model — so the flag raises rather than seeding. Seed data must use the
    Discord fields the models actually declare, and must stay in step with them.
  section: §7 Persistence & Data Model
  family: DATA
  phase: 1
  status: Done
  review: false
- id: DSC-7
  title: Server lookup by numeric id
  full: get_server_id must return the server whose id actually equals the id it
    was given, and None when no server matches. Its integer branch currently
    short-circuits before the id comparison — operator precedence groups the
    condition as "is an int, OR (is a numeric string AND the ids match)" — so
    passing an integer id returns whichever server happens to be first in the
    bot's guild list. Every other lookup in the class (get_category_id and its
    siblings) groups the same condition correctly and is the model to follow.
    The defect is latent today because every caller in the project passes a
    server name, but it makes the id form of --server silently wrong.
  section: §2 Discord Client Library
  family: DSC
  phase: 1
  status: Done
  review: false
- id: OPS-6
  title: Automated tests and continuous integration
  full: "The project's testable logic must be covered by an automated test suite
    that runs on every push and pull request. The units worth testing are the
    ones that are pure or can be exercised against fakes: the name-or-id
    resolution helpers, the daily rate-limit accounting, course routing by
    category and by role, roster path construction and welcome message
    formatting, and the board scripts' SPEC parser. Network calls to Discord and
    OpenAI are stubbed rather than exercised. A GitHub Actions workflow runs the
    suite on the project's supported Python version so a pull request cannot be
    merged on unverified changes."
  section: §10 Operations & Deployment
  family: OPS
  phase: 1
  status: Done
  review: false
- id: ROST-7
  title: Roster path resolved from the results directory
  full: roster_create_channels.py must read its merged roster from the results/
    directory, the same location roster_setup.ipynb writes to and
    hydrate_server.py reads from. It currently builds the bare filename without
    the directory, so the path resolves against the repository root and the
    script fails to find a roster that is present.
  section: §4 Roster Ingestion & Student Channels
  family: ROST
  phase: 1
  status: Done
  review: false
- id: ROST-8
  title: Welcome message mentions the student
  full: The pinned welcome message in a per-student channel must mention the
    student so they are notified when the channel appears. It currently
    interpolates the member's username into Discord's role-mention syntax, which
    Discord cannot resolve, so the mention renders as literal text and the
    student is never pinged. A user mention takes the member's numeric id, and
    the admins-role mention alongside it is already correct and shows the right
    form.
  section: §4 Roster Ingestion & Student Channels
  family: ROST
  phase: 1
  status: Done
  review: false
- id: OPS-7
  title: Continuous deployment
  full: "A commit merged to the default branch is deployed to the production
    droplet automatically, and only after the full test suite has passed.
    Deployment updates the droplet's existing git checkout to that exact commit
    over SSH, so the running version is always identifiable on both ends; it
    installs dependencies only when the pinned dependency files changed, and
    reloads the pm2 process. It must never disturb untracked files — the .env,
    the SQLite message log and the logs directory — and must never run the
    destructive migrate.py. The deploy refuses to overwrite hand edits: if a
    tracked file has been modified directly on the server it aborts and reports
    the diff rather than discarding the change.…"
  section: §10 Operations & Deployment
  family: OPS
  phase: 2
  status: Done
  review: false
- id: BOARD-4
  title: Card status follows the slice
  full: "A requirement's card shows where its work actually is: In progress when a
    slice starts, In review when its pull request opens, and Done when that pull
    request merges. GitHub's own closing keywords cannot do this here: Closes N
    fires only for a pull request merged into the repository's default branch,
    and every branch in the platform build targets the long-lived integration
    branch instead, so nothing would ever close and every card would sit in
    Backlog while the work happened. scripts/board/status.mjs is the explicit
    substitute — it writes the status into manifest.yaml, which is the board's
    source of truth, and reconciles the board with it. Pull requests still carry
    Closes N, so the link…"
  section: §11 Specification & Project Board Tooling
  family: BOARD
  phase: 3
  status: In review
  review: false
- id: PLAT-1
  title: Monorepo layout
  full: "The system is one npm-workspaces monorepo on Node 22, TypeScript
    throughout, ESM throughout. packages/ holds libraries with no process of
    their own — configuration, logging, shared zod schemas, data access, the
    answering core, the action layer, the Discord and OpenAI clients,
    provisioning, background jobs, the MCP server, and the OAuth authorization
    server. apps/ holds the four processes: the Express API, the Discord bot,
    the background worker, and the React control panel. e2e/ holds Playwright
    specs and the fake upstreams they run against. Nothing in packages/ imports
    from apps/."
  section: §12 Platform Architecture
  family: PLAT
  phase: 3
  status: Done
  review: false
- id: PLAT-2
  title: Package boundaries
  full: "Dependencies between packages are acyclic and enforced by lint rule
    rather than convention. packages/schemas depends on nothing but zod, because
    it is the contract shared by web forms, API validation and bot runtime, and
    a dependency there would pull the server into the browser bundle. apps/web
    may import packages/schemas and nothing else from the workspace: importing
    the data, configuration, Discord or OpenAI packages into a browser bundle
    would ship secrets to every visitor, so that specific import is blocked by
    an ESLint no-restricted-imports rule rather than left to review."
  section: §12 Platform Architecture
  family: PLAT
  phase: 3
  status: Done
  review: false
- id: PLAT-3
  title: One gateway connection
  full: apps/bot holds the only Discord gateway connection. The API and the worker
    reach Discord over REST with the same token, so there is no inter-process
    coordination to get wrong; Discord enforces the shared rate-limit buckets
    server-side. Each REST client is configured below the global request ceiling
    so the two processes together stay under it.
  section: §12 Platform Architecture
  family: PLAT
  phase: 3
  status: Backlog
  review: false
- id: PLAT-4
  title: Process topology
  full: "Four processes, each single-instance: API, bot, worker, and a static
    build served by nginx. Never clustered — multiple API workers would multiply
    writers against a single-writer database for no gain, and two gateway
    connections on one token is an error rather than redundancy."
  section: §12 Platform Architecture
  family: PLAT
  phase: 3
  status: Backlog
  review: false
- id: PLAT-5
  title: No import-time side effects
  full: Modules do not open connections, read configuration files, construct API
    clients or write to stdout when they are imported. The current system does
    all four, which is why its configuration cannot be reloaded, scoped per
    tenant, or tested without a live database. Connections and clients are
    created lazily and explicitly.
  section: §12 Platform Architecture
  family: PLAT
  phase: 3
  status: Done
  review: false
- id: PROJ-1
  title: Courses are grouped into projects
  full: Course configurations belong to a project — typically a term, such as
    "Fall 2026". An organization may have any number of projects and a project
    any number of courses. This replaces the convention of encoding the term in
    Discord role names.
  section: §16 Projects
  family: PROJ
  phase: 3
  status: Done
  review: false
- id: PROJ-2
  title: Archiving a project
  full: Archiving a project stops its courses routing without deleting anything.
    This is the first-class form of the existing practice of commenting a course
    out of the configuration file, and it is reversible.
  section: §16 Projects
  family: PROJ
  phase: 3
  status: Done
  review: false
- id: PROJ-3
  title: Names must not collide within a server
  full: A course is matched to an incoming message by the name of the Discord
    category it arrived in, and secondarily by the author's roles. One server
    may host several projects at once, so category and role names must be unique
    across every enabled course in that server, regardless of project. A save
    that would collide is refused, naming the project and course it conflicts
    with. Archived projects are excluded, so a term may reuse the previous
    term's names once that term is archived.
  section: §16 Projects
  family: PROJ
  phase: 3
  status: Done
  review: false
- id: QA-1
  title: Tests fail before they pass
  full: New behaviour is covered by a test that fails without the change. A test
    that passes before the code is written proves nothing about the code.
  section: §17 Quality, Types & Tooling
  family: QA
  phase: 3
  status: Backlog
  review: false
- id: QA-2
  title: No live services in tests
  full: Unit and integration tests never reach a real network. External services
    are replaced by adapters pinned in the test configuration, each with a
    comment naming the leak it prevents. End-to-end tests run the real API, the
    real production web build and the real worker against fake upstreams and a
    throwaway database.
  section: §17 Quality, Types & Tooling
  family: QA
  phase: 3
  status: Backlog
  review: false
- id: QA-3
  title: Test data is synthetic
  full: No test, fixture or continuous-integration job reads the live database. It
    holds real students' names, email addresses and conversations.
  section: §17 Quality, Types & Tooling
  family: QA
  phase: 3
  status: Backlog
  review: false
- id: QA-4
  title: Coverage floor where it matters
  full: Coverage is enforced as a floor on the answering core, the action layer
    and the data access layer, rather than as a blanket percentage across the
    whole tree. A uniform target across a user interface buys assertions about
    markup at the cost of attention to logic.
  section: §17 Quality, Types & Tooling
  family: QA
  phase: 3
  status: Backlog
  review: false
- id: QA-5
  title: Agent guardrails are executable
  full: The constraints that protect student data and credentials from automated
    tooling are implemented as blocking hooks with their own regression tests,
    not as prose instructions. A prose rule competes for attention; a hook does
    not need anyone to be watching. A silent regression in such a hook simply
    stops blocking, which is why it is tested like production code.
  section: §17 Quality, Types & Tooling
  family: QA
  phase: 3
  status: Backlog
  review: false
- id: QA-6
  title: Environment template cannot drift
  full: Every environment variable the configuration schema requires appears in
    the tracked example file, verified by a test. A missing variable otherwise
    surfaces as a failure hours into a deployment.
  section: §17 Quality, Types & Tooling
  family: QA
  phase: 3
  status: Done
  review: false
- id: TEN-1
  title: The tenant is an organization
  full: Every scoped record carries an organization id. An account gets a personal
    organization on sign-up; membership is a separate record so a second
    instructor or a teaching assistant can be added without restructuring
    anything.
  section: §15 Tenancy & Server Registration
  family: TEN
  phase: 3
  status: Done
  review: false
- id: TEN-2
  title: Repository-level scoping
  full: Every data-access function takes the organization id as its first
    parameter and includes it in the query. There is no function that fetches a
    scoped record by id alone, and route handlers do not reach the database
    directly. Tenant isolation is therefore a property of the data layer rather
    than a rule each handler must remember.
  section: §15 Tenancy & Server Registration
  family: TEN
  phase: 3
  status: Done
  review: false
- id: TEN-3
  title: One organization per Discord server
  full: "A Discord server is bound to exactly one organization, structurally: the
    server's snowflake is the primary key of the binding record, so a second
    claim cannot be inserted. An attempt to register a server already registered
    elsewhere is refused, and a server whose bot was removed may be re-claimed."
  section: §15 Tenancy & Server Registration
  family: TEN
  phase: 3
  status: Done
  review: false
- id: ACT-1
  title: Every operation is an action
  full: "Everything the platform can do on a user's behalf is an action: a dotted
    name, a zod input schema, a declared access policy, an optional metering
    hook, and an execute function. Actions are the single write path. The web
    control panel and the MCP server both reach them through the same
    dispatcher, so an assistant's call is an ordinary call by the account that
    authorized it rather than a parallel implementation with its own rules."
  section: §13 Action & Authorization Layer
  family: ACT
  phase: 5
  status: Backlog
  review: false
- id: ACT-2
  title: Declared authorization
  full: An action declares how it is authorized rather than checking inside its
    body, and an action with no declaration does not compile. A policy pairs a
    machine-readable descriptor — the resource it protects and the level of
    access required — with a function that resolves and returns the entity it
    authorized. Because the policy hands the resolved, tenant-scoped entity to
    the execute function, an action cannot reach a record without having been
    given one that was already checked. Policies read the database and nothing
    else. Authorization runs outside the usage attribution context, so a policy
    that called a paid provider would spend money nobody is attributed for.
  section: §13 Action & Authorization Layer
  family: ACT
  phase: 5
  status: Backlog
  review: false
- id: ACT-3
  title: Refusals reveal nothing
  full: Every refusal is the same error whether the record does not exist or the
    caller has no access to it, so an identifier cannot be probed to learn
    which. The error carries no detail about the record it protected.
  section: §13 Action & Authorization Layer
  family: ACT
  phase: 5
  status: Backlog
  review: false
- id: ACT-4
  title: Dispatch pipeline
  full: Dispatch validates the input against the action's schema, authorizes,
    meters, then executes — in that order, in one place. Authorization precedes
    metering so an unauthorized call never consumes an allowance. Typed errors
    are mapped to HTTP statuses by one middleware; no route maps its own, so the
    same failure looks the same everywhere.
  section: §13 Action & Authorization Layer
  family: ACT
  phase: 5
  status: Backlog
  review: false
- id: ACT-5
  title: Access audit index
  full: "A test table pins every registered action to its declared access
    descriptor. Weakening a guard still type-checks, so the table is what makes
    the change visible: it appears as a one-line diff in a file a reviewer
    reads. An action may authorize itself by an explicit exception only if its
    reason is recorded in the same test."
  section: §13 Action & Authorization Layer
  family: ACT
  phase: 5
  status: Backlog
  review: false
- id: ACT-6
  title: Machine-readable catalog
  full: "The registry derives a JSON-Schema catalog of every action — name,
    description, input schema and access descriptor — for AI channels to
    consume. The catalog is machinery, not itself a tool list: what an assistant
    may reach is decided by the MCP tool surface, not by what the catalog
    contains."
  section: §13 Action & Authorization Layer
  family: ACT
  phase: 5
  status: Backlog
  review: false
- id: AUTH-1
  title: Passwordless email sign-in
  full: An account is created and accessed by a link sent to an email address.
    Tokens are stored as hashes, expire within minutes, and are single-use —
    consumed in the same transaction that creates the session, so a link cannot
    be replayed.
  section: §14 Accounts & Authentication
  family: AUTH
  phase: 5
  status: Backlog
  review: false
- id: AUTH-2
  title: Google sign-in
  full: Google OAuth 2.0 with PKCE is offered alongside email. A Google identity
    links to an existing account only when the provider asserts the email is
    verified and it matches; otherwise a new account is created. Linking on an
    unverified email is account takeover.
  section: §14 Accounts & Authentication
  family: AUTH
  phase: 5
  status: Backlog
  review: false
- id: AUTH-3
  title: Sessions
  full: Sessions are opaque random tokens stored as hashes, carried in an
    HttpOnly, Secure, SameSite cookie, and rotated on sign-in. Storing hashes
    rather than the tokens themselves is what makes administrative session
    revocation possible. Non-GET requests are checked against their origin.
  section: §14 Accounts & Authentication
  family: AUTH
  phase: 5
  status: Backlog
  review: false
- id: AUTH-4
  title: Platform administrators
  full: Administrators are identified by an email allowlist in the environment,
    read on every check rather than captured at startup, so adding or removing
    one takes effect without a deployment. It is never a self-granted role or a
    database flag.
  section: §14 Accounts & Authentication
  family: AUTH
  phase: 5
  status: Backlog
  review: false
- id: TEN-4
  title: Installation
  full: "The bot is installed through Discord's OAuth flow, initiated from a
    signed-in session. The platform verifies that the installing account
    actually administers the server before binding it, and discards the user
    access token afterwards: nothing needs it, and storing it is a liability."
  section: §15 Tenancy & Server Registration
  family: TEN
  phase: 6
  status: Backlog
  review: false
- id: TEN-5
  title: Cross-tenant access is indistinguishable from absence
  full: A request for another organization's record is refused as not-found rather
    than forbidden, so the existence of a record is never disclosed. This is
    verified by a test matrix covering every route against another
    organization's session, an absent session, and a disabled account.
  section: §15 Tenancy & Server Registration
  family: TEN
  phase: 6
  status: Backlog
  review: false
- id: TEN-6
  title: Removal preserves data
  full: Removing the bot from a server marks the binding inactive; it never
    deletes the organization's courses, rosters or transcripts. A
    re-installation restores a working setup, and transcripts are records an
    instructor may be required to retain. Deleting that data is a separate,
    explicitly confirmed, audited action.
  section: §15 Tenancy & Server Registration
  family: TEN
  phase: 6
