# Board manifest — SOURCE OF TRUTH for the GitHub project board.
# Generated by scripts/board/derive.mjs, then hand-curated. Re-running derive
# preserves your phase/status/review edits. Resolve every `review: true` row,
# then run scripts/board/sync.mjs. Do not edit ids (they key the issues).

- id: AI-1
  title: Responses API with stored prompts
  full: Answers are generated through the OpenAI Responses API using a stored
    prompt referenced by the course's prompt_id. The prompt itself — the
    assistant's persona and answering rules — is maintained in the OpenAI
    dashboard rather than in this repository, so an instructor can revise the
    assistant's behavior without a code change or a redeploy. A course with no
    prompt_id configured is logged as a misconfiguration and its messages go
    unanswered.
  section: §6 OpenAI Integration
  family: AI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: AI-2
  title: File search over course materials
  full: Every request enables the file_search tool against the course's
    vector_store_id, which holds that course's uploaded notes, syllabus and
    schedule. This is what grounds answers in the actual course material; the
    configured instructions direct the assistant to answer from the uploaded
    files and to keep replies to at most one paragraph.
  section: §6 OpenAI Integration
  family: AI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: AI-3
  title: Per-user conversation continuity
  full: Each user gets an OpenAI conversation created on their first message and
    reused for every message afterward, so follow-up questions carry the earlier
    context. The conversation is seeded with an opening item that states the
    user's Discord name, their Discord user id and the course they are in, and
    carries the user id in its metadata. Conversations are held in memory keyed
    by Discord member, so a process restart begins fresh conversations.
  section: §6 OpenAI Integration
  family: AI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: AI-4
  title: Model and output bounds
  full: The model is taken from the course's configuration, defaulting to gpt-4o
    when unset; courses currently pin gpt-4.1. Every request bounds output at
    2048 tokens and is stored on OpenAI's side (store=True) so that conversation
    state persists between turns.
  section: §6 OpenAI Integration
  family: AI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: AI-5
  title: Analytics topic classification model
  full: The analytics notebook makes its own OpenAI calls, classifying each
    conversation with gpt-4o-mini. This is deliberately a cheaper model than the
    one serving students, since classification runs over the full history rather
    than per message.
  section: §6 OpenAI Integration
  family: AI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ANLY-1
  title: Derived course, channel type and semester
  full: "analytics.ipynb loads the message log joined to its users and derives
    three analysis dimensions from the raw Discord category string on each
    message: the course it belongs to, the type of channel (a shared global
    channel versus a private student channel), and the semester. This derivation
    is what lets a single database serve cross-course and cross-semester
    comparisons."
  section: §9 Analytics
  family: ANLY
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ANLY-2
  title: Message volume reporting
  full: The notebook charts total message volume by course, by course and
    semester, and by channel type, plus a weekly activity line chart. Together
    these answer how much the bot is used, whether use is growing, and whether
    it is used more in private or shared spaces.
  section: §9 Analytics
  family: ANLY
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ANLY-3
  title: Per-user engagement reporting
  full: The notebook charts the fifteen most active users and the distribution of
    messages per user, showing whether use is broad across a cohort or
    concentrated in a few students.
  section: §9 Analytics
  family: ANLY
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ANLY-4
  title: Conversation grouping
  full: Consecutive messages from a user are grouped into conversations using a
    configurable silence gap, 30 minutes by default. The notebook then reports
    conversations per course, the distribution of conversation lengths, and
    conversations per user — the unit that matters for "how many distinct
    questions were asked", as opposed to raw message count.
  section: §9 Analytics
  family: ANLY
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ANLY-5
  title: Topic classification
  full: Each conversation is classified into a topic such as "Assignments &
    homework" or "Technical setup & tools" by an OpenAI model. Results are
    reported as an overall topic bar chart, a per-course stacked bar, a
    per-course-per-semester grouped bar, a heatmap of unique users per topic per
    course, and a box plot of conversation length by topic. This section is the
    only part of the notebook that requires an API key; every other section runs
    without one.
  section: §9 Analytics
  family: ANLY
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ANLY-6
  title: Classification cache
  full: Topic labels are cached in data/topic_classifications.json and re-used on
    later runs, so re-running the notebook classifies only conversations it has
    not seen before. This keeps repeat runs fast and keeps the classification
    cost proportional to new activity rather than to total history.
  section: §9 Analytics
  family: ANLY
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: ANLY-7
  title: Summary table
  full: The notebook closes with a pivot table of conversation count, unique
    users, average messages per conversation and average conversation duration,
    broken down by course, semester and topic — the single table an instructor
    can read to compare semesters.
  section: §9 Analytics
  family: ANLY
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOARD-1
  title: Spec-derived board manifest
  full: scripts/board/derive.mjs parses this document — the four-hash requirement
    subheadings and the numbered three-hash section headings they sit under —
    together with docs/ROADMAP.md, and writes scripts/board/manifest.yaml, the
    curated source of truth for the project board. Re-running it refreshes
    titles, sections and families from the spec while preserving any phase,
    status and review values a human has set, adds newly-introduced ids, and
    reports ids that have disappeared from the spec as stale rather than
    deleting them.
  section: §11 Specification & Project Board Tooling
  family: BOARD
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOARD-2
  title: Idempotent board sync
  full: scripts/board/sync.mjs pushes the manifest to GitHub, upserting one issue
    per requirement. Each issue carries a hidden marker keying it to its
    requirement id, which is what makes re-runs idempotent rather than
    duplicative. Title, body, milestone and the spec label are re-enforced from
    the manifest on every run; an issue's board status and open/closed state are
    seeded once at creation and thereafter owned by the board and its automation
    unless --reconcile is passed. The script supports --dry-run, --limit,
    --reconcile and an opt-in --prune, and requires an authenticated gh CLI.
  section: §11 Specification & Project Board Tooling
  family: BOARD
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOARD-3
  title: Spec format contract
  full: Because the board is generated from this file, its structure is
    load-bearing. Requirements must be four-hash subheadings whose text is a
    family-and-number id followed by a title, with the requirement's description
    in the prose beneath the heading up to the next heading; sections must be
    three-hash headings whose text is a number, a period and a title; and an
    existing id must never be changed, since renaming or renumbering orphans the
    issue it keys and creates a duplicate. The contract is restated in
    .claude/CLAUDE.md so it survives contributor turnover.
  section: §11 Specification & Project Board Tooling
  family: BOARD
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-1
  title: Mention-gated responses
  full: response_bot.py connects to Discord and stays running. It replies only
    when the bot is directly mentioned in a message or when a message replies to
    it; every other message in every channel is ignored. Messages authored by
    the bot itself are ignored, which prevents self-triggered loops. This keeps
    the bot usable in busy shared channels without it answering conversations
    between students.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-2
  title: Course routing by category
  full: "Each incoming mention is attributed to exactly one course before it is
    answered. The primary signal is the Discord category containing the
    message's channel: if that category name appears in a course's configured
    categories list, the message belongs to that course. Course attribution
    determines which OpenAI prompt, vector store, model and rate limit apply, so
    a student asking in the Web Design categories gets Web Design course
    material and never another course's."
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-3
  title: Course routing fallback by role
  full: When a message's category matches no course — for example in a direct
    message or an uncategorized channel — the bot falls back to the author's
    Discord roles, matching them against each course's configured student and
    admin role names. The first course whose role the author holds wins.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-4
  title: Unattributable messages are ignored
  full: A mention that cannot be attributed to any course by either signal is
    logged and discarded with no reply. The bot therefore stays silent outside
    the course spaces it has been configured for, rather than answering with
    generic model knowledge.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-5
  title: Per-user daily request limits
  full: Each course sets limits.max_requests_per_day, defaulting to 10, and the
    bot counts requests per user per calendar day. On the request that reaches
    the limit the answer is still given but is prefixed with a notice telling
    the student they have reached the day's maximum and should see the course
    admins for help. Requests beyond the limit are silently ignored. The counter
    resets when the date changes, and is held in memory, so it restarts at zero
    when the process restarts.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-6
  title: Bot mention rewriting
  full: Before a message is sent to the model, the raw Discord mention token for
    the bot is replaced with the readable name @Bloombot, so the model sees a
    sentence addressed to a named assistant rather than an opaque numeric id.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-7
  title: Citation marker stripping
  full: File-search answers may carry inline source markers of the form 【…】. These
    are stripped from the reply before it is posted, since they are noise to a
    student reading in Discord.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-8
  title: Reply in place
  full: The answer is posted back into the same channel the question was asked in,
    so a student's conversation with the bot stays in their own private channel
    or in the shared course channel where it started, and remains visible to
    course staff who have access there.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-9
  title: Graceful degradation on API failure
  full: If the OpenAI call raises, the error is logged with its detail and the
    student receives a plain-language apology stating that the bot cannot
    respond intelligently right now and directing them to that course's admins.
    The bot does not crash, and continues serving other messages.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: BOT-10
  title: Structured operational logging
  full: The bot logs, at INFO level, each attributed message with its author,
    author id, category and channel; the prompt text; the resolved OpenAI prompt
    id and conversation id; the generated answer; and the user's running request
    count against their limit. OpenAI errors and database failures are logged at
    ERROR level. Logs are written to response_bot.log inside the directory named
    by LOGS_DIR, which is created at startup if it does not exist.
  section: §5 AI Chatbot
  family: BOT
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CFG-1
  title: Single YAML course configuration
  full: "All course-specific behavior is driven by bot_config.yml, read at startup
    by the bot and by every management script. The file declares one Discord
    server (server.name) and a list of server.courses. Every course entry
    carries a human-readable title, a short file_prefix used to locate its
    roster and questionnaire CSV files, an openai_assistant block, a roles
    block, and a categories list. Nothing about a course is hard-coded in
    Python: adding a course means adding a YAML entry, and a course is
    deactivated by commenting its entry out."
  section: §1 Configuration
  family: CFG
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CFG-2
  title: Per-course OpenAI settings
  full: "Each course's openai_assistant block specifies the OpenAI resources that
    answer its students' questions: a display name, a stored prompt_id
    (Responses API prompt), a vector_store_id holding the uploaded course notes,
    syllabus and schedule, free-form instructions describing the assistant's
    persona, a tools list, a model, and a limits.max_requests_per_day cap
    applied per user. A legacy Assistants API id field may still be present but
    is not used by the running bot."
  section: §1 Configuration
  family: CFG
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CFG-3
  title: Per-course roles
  full: "Each course declares two Discord role names under roles: admins
    (instructors and course assistants) and students. Role names are
    semester-scoped by convention, e.g. admins-wd-su26 and students-wd-su26, so
    that a new semester's roles can be created without disturbing the previous
    one. These names are the only link between the config and the server's
    permission model; scripts resolve them to Discord role ids at runtime."
  section: §1 Configuration
  family: CFG
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CFG-4
  title: Per-course category and channel declarations
  full: "A course's categories list declares the Discord categories that belong to
    it. An entry may be a plain string (the category name) or a mapping with a
    name and an optional channels list. Each channel entry has a name and an
    optional admins_only: true flag. Categories declared as plain strings
    receive a placeholder channel instead of named channels. A course typically
    declares one … - GLOBAL category holding shared channels and several
    numbered … - STUDENTS NN categories that hold per-student private channels,
    since Discord caps a category at 50 channels."
  section: §1 Configuration
  family: CFG
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CFG-5
  title: Environment variables and secrets
  full: "Credentials live only in a .env file loaded by python-dotenv in every
    entry point, never in the YAML config or in source. env.example documents
    the required variables: BOT_APP_ID, BOT_PUBLIC_KEY, BOT_TOKEN,
    BOT_PERMISSIONS and OPENAI_API_KEY. Three optional variables tune runtime
    behavior: LOGS_DIR (default ./logs), LOG_LEVEL (default INFO) and
    SQL_LITE_DB_PATH (default ./data/data.db). The bot token must belong to a
    Discord application with at least MANAGE_CHANNELS permission and with the
    Server Members and Message Content privileged intents enabled."
  section: §1 Configuration
  family: CFG
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CLI-1
  title: Server inspection commands
  full: main.py exposes DiscordManager's inspection over a command line.
    --show-servers lists every server the bot can see; with a --server, the
    --show-categories, --show-channels and --show-users flags list that server's
    structure, optionally narrowed by --category or --channel. This is the
    fastest way to obtain the ids the other commands take.
  section: §8 Command-Line Administration
  family: CLI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CLI-2
  title: Create and delete commands
  full: The same CLI creates a category (--create-category), creates a channel
    (--create-channel, optionally within --category), and deletes either
    (--delete-category, --delete-channel). These are the manual escape hatch for
    one-off corrections that the config-driven scripts do not cover.
  section: §8 Command-Line Administration
  family: CLI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CLI-3
  title: Name or id arguments
  full: Every selector argument — --server, --category, --channel, --user, --role
    and the delete targets — accepts either a numeric Discord id or a name,
    converting digit strings to integers automatically. An instructor can
    therefore work entirely from the names visible in the Discord UI.
  section: §8 Command-Line Administration
  family: CLI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: CLI-4
  title: Argument validation and token resolution
  full: The CLI refuses to run without either --show-servers or a --server, and
    refuses category, channel or user operations that were given no server,
    reporting the missing argument rather than failing against Discord. The bot
    token comes from --token when given and otherwise from BOT_TOKEN in the
    environment or .env.
  section: §8 Command-Line Administration
  family: CLI
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DATA-1
  title: SQLite store via peewee
  full: All persisted state lives in a single SQLite database, by default
    data/data.db and overridable with SQL_LITE_DB_PATH, accessed through the
    peewee ORM. The connection is established and verified at import time by
    models/base.py, which every model shares. SQLite keeps the deployment to a
    single process with no database server to operate.
  section: §7 Persistence & Data Model
  family: DATA
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DATA-2
  title: Base model conventions
  full: All models inherit from Base, which supplies created_at and updated_at
    timestamps and two shared behaviors. Its get_or_create override matches on
    any one of the supplied fields rather than requiring all of them, so a user
    can be found by Discord id or by email or by username, whichever is known at
    the call site. Its merge fills in empty fields and updates changed ones from
    a supplied record, reporting each change, so roster data can be folded into
    an existing user without clobbering what is already there.
  section: §7 Persistence & Data Model
  family: DATA
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DATA-3
  title: User model
  full: A User row records a student's discord_id (unique), discord_username,
    email, first_name, last_name and github_username, with unique indexes on
    Discord id and email. Users are created on demand the first time the bot
    sees a message from someone, so the table fills itself without an import
    step, and the roster fields are available to be merged in later.
  section: §7 Persistence & Data Model
  family: DATA
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DATA-4
  title: Message log
  full: "Every message in both directions is logged as a Message row: the content,
    the Discord category and channel it occurred in, a direction of from
    (student to bot) or to (bot to student), and a foreign key to the user,
    cascading on delete. Rows are indexed by user and by creation time, the two
    axes the analytics notebook queries on. Logging is wrapped so that a
    database failure is recorded but never blocks the student's reply."
  section: §7 Persistence & Data Model
  family: DATA
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DATA-5
  title: Migration script
  full: migrate.py manages the schema from the command line, dropping, creating
    and optionally seeding the users and messages tables. Its default run drops
    and recreates; --no-drop and --no-create suppress either step and --populate
    seeds mock data. It is the documented first step of local setup.
  section: §7 Persistence & Data Model
  family: DATA
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DSC-1
  title: DiscordManager client
  full: DiscordManager (in discord_manager.py) subclasses discord.Client and is
    the single Discord abstraction used by every script in the project. It
    requests the default intents plus guilds, members and message_content, the
    last two of which are privileged and must be enabled in the Discord
    Developer Portal. Its constructor takes a declarative description of the
    work to do — which server, category, channel, user or role to act on, and
    which of show/create/delete to perform — and its on_ready handler executes
    that work in a fixed order once the connection is cached and ready.
  section: §2 Discord Client Library
  family: DSC
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DSC-2
  title: Name-or-id resolution
  full: Every lookup accepts either a numeric Discord id or a human-readable name,
    so scripts and CLI users can refer to servers, categories, channels, users
    and roles by the names they see in the Discord UI. get_server_id,
    get_category_id, get_channel_id, get_user_id and get_role_id each perform
    this resolution and return None when no match exists; get_user_id optionally
    matches display names as well as usernames, which is what makes
    roster-supplied Discord handles usable. fix_ids() normalizes all constructor
    arguments from names to ids before any action runs.
  section: §2 Discord Client Library
  family: DSC
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DSC-3
  title: Create and delete operations
  full: The client can create a category, create a channel (optionally inside a
    category), and delete either. add_category is a no-op when a category of
    that name already exists unless duplicates are explicitly requested, so
    scripts built on it are safe to re-run. remove_category deletes the
    category's child channels before the category itself.
  section: §2 Discord Client Library
  family: DSC
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DSC-4
  title: Membership and permission operations
  full: The client can grant a user access to a category or to an individual
    channel by writing a permission overwrite, and can assign a Discord role to
    a user. DiscordManager.create_permissions builds an overwrite from the four
    flags the project uses — view_channel, read_messages, send_messages and
    manage_messages.
  section: §2 Discord Client Library
  family: DSC
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DSC-5
  title: Inspection output
  full: print_guilds, print_categories, print_channels and print_users render the
    server's structure to standard output, scoped by an optional category or
    channel. These are what back the CLI's --show- flags and are the primary way
    an instructor inspects a server without opening the Discord UI.
  section: §2 Discord Client Library
  family: DSC
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: DSC-6
  title: One-shot and long-running modes
  full: The event_loop constructor flag selects between the two ways the project
    uses Discord. With event_loop=False the client performs its
    constructor-described actions on on_ready and then closes the connection
    cleanly, which is how the CLI and the management scripts behave. With
    event_loop=True the client stays connected and keeps dispatching events,
    which is how the chatbot runs. Scripts in the long-running mode call
    client.stop() themselves once their work is finished.
  section: §2 Discord Client Library
  family: DSC
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: OPS-1
  title: Python environment
  full: The project targets Python 3.12 and pins its dependencies with pipenv
    (Pipfile, Pipfile.lock); requirements.txt is maintained as a flat
    alternative for environments without pipenv. Runtime dependencies are
    discord.py, openai, python-dotenv, pyyaml and peewee; the analytics stack
    adds pandas, matplotlib and seaborn, and the dev extras add ipykernel for
    the notebooks.
  section: §10 Operations & Deployment
  family: OPS
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: OPS-2
  title: Process supervision with pm2
  full: "The bot runs under pm2 in production, configured by ecosystem.config.cjs,
    which names the process bloombot, runs response_bot.py through pipenv so it
    executes inside the project's virtualenv, and directs pm2's own stdout and
    stderr to timestamped files in logs/. pm2 restarts the bot on crash, and pm2
    save plus pm2 startup make it survive a host reboot. No secrets are placed
    in the pm2 config; the bot loads .env itself. The config file carries the
    .cjs extension because package.json declares type: module, under which a .js
    config would be parsed as an ES module and expose no apps to pm2."
  section: §10 Operations & Deployment
  family: OPS
  phase: 0
  status: Done
  review: false
  note: baseline (not claimed by a roadmap phase)
- id: OPS-3
  title: Configurable logging
  full: Log destination and verbosity are environment-controlled through LOGS_DIR
    and LOG_LEVEL, defaulting to ./logs at INFO. Every log line carries a
    timestamp and level. The log file is named after the running script, so each
    entry point writes its own file.
  section: §10 Operations & Deployment
  family: OPS
  phase: 0
  status: Done
