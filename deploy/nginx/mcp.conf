# MCP-7 / MCP-8 — the nginx blocks that make the MCP surface publicly reachable.
#
# Paste these inside the `listen 443 ssl` server block of
# /etc/nginx/sites-enabled/bloombot (the one whose `server_name` is
# PUBLIC_APP_URL's own host), then `sudo nginx -t && sudo systemctl reload nginx`.
# Applying this needs root; the deploy user cannot, which is why this file is
# committed here rather than applied by scripts/deploy.sh.
#
# WHY EACH PATH IS LISTED SEPARATELY, rather than one prefix:
# apps/mcp serves its OAuth metadata, /authorize, /token, /register, /revoke
# and /mcp at its OWN ROOT (apps/mcp/src/server.ts mounts `mcpAuthRouter` at
# root and `/mcp` beside it). There is no single prefix that captures them, so
# each is routed explicitly. Two paths are deliberately NOT routed here:
#
#   /health                  — apps/api already owns it (`location = /health`),
#                              and apps/mcp has its own on its loopback port.
#                              Routing it here would break the deploy's health
#                              check.
#   /.well-known/acme-challenge — Certbot owns it. The oauth-protected-resource
#                              block below is a prefix match on a longer path,
#                              so it cannot shadow ACME renewal.
#
# The `location /` SPA fallback is what currently answers /mcp with index.html
# and an HTTP 200 — an MCP client receives HTML where it expects JSON-RPC and
# fails confusingly. These blocks must come before it (nginx matches exact `=`
# and longest-prefix before the catch-all regardless of file order, but keeping
# them above `location /` keeps the file readable).

# --- The MCP endpoint itself -------------------------------------------------
# Streamable HTTP: responses may be a long-lived SSE stream, so buffering is
# off, the hop-by-hop Connection header is cleared, and the read timeout is
# generous. Without these, a streamed tool result is buffered or cut off.
location = /mcp {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# --- OAuth 2.1 discovery ----------------------------------------------------
# A client reads these first; they are what make "add the connector and sign
# in" work without anyone pasting a token.
location = /.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# A prefix, not an exact match: the resource identifier is /mcp, so the SDK
# serves this document at /.well-known/oauth-protected-resource/mcp as well as
# at the bare path.
location /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- OAuth 2.1 endpoints ----------------------------------------------------
# Exact matches, so nothing else on the site is shadowed by these generic names.
location = /authorize {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /token {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /register {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /revoke {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- The connection-request API ---------------------------------------------
# apps/api, not apps/mcp: MCP-11 moved the human-facing consent screen itself
# onto the panel (apps/web's own `/connect-assistant/:requestId`, served by
# the `location / ` SPA fallback below) — what lives here now is only the
# JSON `apps/api/src/routes/mcp-oauth-consent.ts` answers
# (`GET /oauth/mcp/request`, `POST /oauth/mcp/decide`), which that page calls
# with `fetch` and which reuses the existing session cookie the same way the
# old server-rendered screen did. Without this block those calls hit the SPA
# fallback, get index.html with a 200 where they expect JSON, and the
# connector hangs with no consent ever recorded.
location /oauth/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Clickjacking headers for the panel's own consent screen (MCP-11 rework
#     round 1, must-fix 2) — MANUAL, DEFENSE IN DEPTH, not the defence that
#     actually ships --------------------------------------------------------
# `/connect-assistant/:requestId` (the page above, served by your site's own
# `location / { ... }` SPA fallback — not a block this file owns, since
# mcp.conf's own blocks are all proxies to apps/mcp/apps/api) renders the
# Allow/Deny buttons MCP-7's security review exists to protect. The defence
# that actually ships is in the app itself: `ConnectAssistant.tsx` refuses to
# render those controls at all when it detects `window.top !== window.self`,
# which needs no nginx change and nothing here to be applied. These two lines
# are the same protection at the transport layer, for a browser old enough to
# ignore `X-Frame-Options`/CSP the app already sets on its own JSON responses
# regardless (`routes/mcp-oauth-consent.ts`) — belt and suspenders, not a
# substitute for the in-app check. Paste both **inside your site's own
# `location / { ... }` block**, the same one this file's own header comment
# already asks you to paste every block above *before*:
#
#   add_header X-Frame-Options "DENY" always;
#   add_header Content-Security-Policy "frame-ancestors 'none'" always;
#
# `always` matters: without it, nginx's own `add_header` is silently dropped
# on a non-2xx response (the SPA fallback's own 404s among them), which is
# exactly the response a framed, expired or malformed request would get.
